name: Daily retainer hours report

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the report instead of sending it"
        type: boolean
        default: true
  schedule:
    # 11:55 UTC, Mon-Fri = 6:55am Central (currently CDT, UTC-5). Set an
    # hour earlier than the intended 7:55am to absorb GitHub's observed
    # scheduling delay on this account (first scheduled run fired ~1h13m
    # late). GitHub cron is fixed UTC and doesn't shift for DST, so this
    # drifts to 5:55am once CST resumes in November — change the hour to
    # 12 then (12:55 UTC) to hold 6:55am local.
    - cron: "55 11 * * 1-5"

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run report
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          CLICKUP_TEAM_ID: ${{ secrets.CLICKUP_TEAM_ID }}
          # Not a secret (just a chat room ID) — CMG's confirmed send target.
          # A CLICKUP_CHANNEL_ID repo secret, if set, overrides this.
          CLICKUP_CHANNEL_ID: ${{ secrets.CLICKUP_CHANNEL_ID || '2kyd5muz-26254' }}
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}" = "true" ]; then
            python -m retainer_reminder.run_daily --dry-run
          else
            python -m retainer_reminder.run_daily
          fi
